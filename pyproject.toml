[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-card-delinquency-prediction"
version = "1.0.0"
description = "Portfolio machine-learning project for credit-card delinquency risk estimation"
requires-python = ">=3.10"
dependencies = [
  "joblib==1.5.3",
  "numpy==2.0.2",
  "pandas==2.3.3",
  "scikit-learn==1.6.1",
  "xlrd==2.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
